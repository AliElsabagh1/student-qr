<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بوابة استخراج كود الطالب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --navy-950:#0d1826;
    --navy-900:#122238;
    --navy-800:#1c3352;
    --navy-700:#2a4570;
    --papyrus:#e9dfc6;
    --papyrus-dim:#d8ccac;
    --ink:#20180f;
    --gold:#c79a3f;
    --gold-bright:#e8bd5c;
    --burgundy:#7d2632;
    --burgundy-dark:#5c1b24;
    --mist:#8fa3bd;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(ellipse at 50% -10%, var(--navy-800) 0%, var(--navy-950) 55%),
      var(--navy-950);
    font-family:'Tajawal', sans-serif;
    color:var(--mist);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
    position:relative;
    overflow-x:hidden;
  }

  /* faint dotted texture, like a security-print backdrop */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:radial-gradient(var(--navy-700) 1px, transparent 1px);
    background-size:26px 26px;
    opacity:0.16;
    pointer-events:none;
  }

  .stage{
    width:100%;
    max-width:480px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:28px;
  }

  .letterhead{
    text-align:center;
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:.14em;
    color:var(--gold);
    text-transform:uppercase;
    margin:0 0 10px;
  }
  .letterhead h1{
    font-family:'Amiri', serif;
    font-weight:700;
    font-size:clamp(28px, 6vw, 38px);
    color:#f2ead4;
    margin:0 0 8px;
    line-height:1.25;
  }
  .letterhead p{
    margin:0;
    font-size:14.5px;
    color:var(--mist);
    line-height:1.7;
  }

  .search-panel{
    width:100%;
    background:linear-gradient(180deg, var(--navy-800), var(--navy-900));
    border:1px solid rgba(232,189,92,0.18);
    border-radius:16px;
    padding:22px;
    display:flex;
    flex-direction:column;
    gap:14px;
    box-shadow:0 20px 50px -20px rgba(0,0,0,0.6);
  }

  .field-label{
    font-size:13px;
    color:var(--gold-bright);
    font-weight:700;
  }

  .search-row{
    display:flex;
    gap:10px;
  }

  input#idInput{
    flex:1;
    min-width:0;
    background:var(--navy-950);
    border:1px solid var(--navy-700);
    color:#f2ead4;
    font-family:'IBM Plex Mono', monospace;
    font-size:19px;
    letter-spacing:.04em;
    padding:14px 16px;
    border-radius:10px;
    outline:none;
    transition:border-color .15s ease, box-shadow .15s ease;
    direction:ltr;
    text-align:center;
  }
  input#idInput::placeholder{
    color:#4d6280;
    font-family:'Tajawal', sans-serif;
    font-size:14px;
    letter-spacing:normal;
  }
  input#idInput:focus{
    border-color:var(--gold);
    box-shadow:0 0 0 3px rgba(199,154,63,0.25);
  }

  button#searchBtn{
    flex-shrink:0;
    background:var(--gold);
    color:var(--navy-950);
    border:none;
    font-family:'Tajawal', sans-serif;
    font-weight:900;
    font-size:15px;
    padding:0 22px;
    border-radius:10px;
    cursor:pointer;
    transition:background .15s ease, transform .1s ease;
  }
  button#searchBtn:hover{background:var(--gold-bright);}
  button#searchBtn:active{transform:scale(0.97);}
  button#searchBtn:focus-visible{outline:3px solid var(--gold-bright); outline-offset:2px;}

  .hint{
    font-size:12.5px;
    color:#5c7191;
    text-align:center;
  }

  /* ---- result states ---- */
  .result-wrap{
    width:100%;
    min-height:2px;
  }

  .empty-msg{
    text-align:center;
    color:var(--burgundy);
    background:rgba(125,38,50,0.12);
    border:1px solid rgba(125,38,50,0.4);
    border-radius:12px;
    padding:16px;
    font-weight:700;
    font-size:14.5px;
    display:none;
  }
  .empty-msg.show{display:block;}

  /* ---- the ticket ---- */
  .ticket{
    position:relative;
    width:100%;
    background:
      repeating-linear-gradient(135deg, rgba(0,0,0,0.02) 0px, rgba(0,0,0,0.02) 2px, transparent 2px, transparent 6px),
      var(--papyrus);
    border-radius:14px;
    padding:26px 24px 22px;
    display:none;
    transform:translateY(14px) scale(0.98);
    opacity:0;
    box-shadow:0 24px 60px -18px rgba(0,0,0,0.65);
  }
  .ticket.show{
    display:block;
    animation:riseIn .5s cubic-bezier(.2,.8,.25,1) forwards;
  }
  @keyframes riseIn{
    to{transform:translateY(0) scale(1); opacity:1;}
  }

  .ticket::before, .ticket::after{
    content:"";
    position:absolute;
    width:26px;
    height:26px;
    border-radius:50%;
    background:var(--navy-950);
    top:50%;
    transform:translateY(-50%);
  }
  .ticket::before{right:-13px;}
  .ticket::after{left:-13px;}

  .ticket-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    border-bottom:1.5px dashed var(--papyrus-dim);
    padding-bottom:16px;
    margin-bottom:18px;
  }
  .ticket-eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:.12em;
    color:#8a7a54;
    text-transform:uppercase;
    margin:0 0 6px;
  }
  .ticket-name{
    font-family:'Amiri', serif;
    font-weight:700;
    font-size:21px;
    color:var(--ink);
    margin:0;
    line-height:1.5;
  }
  .ticket-name.no-name{
    font-family:'Tajawal', sans-serif;
    font-size:14px;
    color:#8a7a54;
    font-weight:500;
  }
  .ticket-code{
    font-family:'IBM Plex Mono', monospace;
    font-size:15px;
    font-weight:600;
    color:var(--burgundy);
    direction:ltr;
    white-space:nowrap;
    margin-right: 2px;
  }

  .ticket-body{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:20px;
    position:relative;
  }

  .qr-frame{
    background:#fff;
    padding:10px;
    border-radius:8px;
    box-shadow:0 2px 8px rgba(0,0,0,0.15);
    flex-shrink:0;
  }
  .qr-frame #qrcode{line-height:0;}

  .stamp{
    position:absolute;
    left:8px;
    bottom:-6px;
    width:92px;
    height:92px;
    border:3px solid var(--burgundy);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--burgundy);
    transform:rotate(-18deg) scale(0);
    opacity:0;
    mix-blend-mode:multiply;
    pointer-events:none;
  }
  .stamp.show{
    animation:stampDown .45s .35s cubic-bezier(.34,1.56,.64,1) forwards;
  }
  @keyframes stampDown{
    0%{transform:rotate(-18deg) scale(2.4); opacity:0;}
    60%{opacity:.85;}
    100%{transform:rotate(-18deg) scale(1); opacity:.85;}
  }
  .stamp::before{
    content:"";
    position:absolute;
    inset:6px;
    border:1px solid var(--burgundy);
    border-radius:50%;
  }
  .stamp span{
    font-family:'Amiri', serif;
    font-weight:700;
    font-size:13px;
    text-align:center;
    line-height:1.3;
  }

  .ticket-footer{
    margin-top:18px;
    padding-top:14px;
    border-top:1.5px dashed var(--papyrus-dim);
    display:flex;
    justify-content:space-between;
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    color:#8a7a54;
    letter-spacing:.04em;
  }

  @media (prefers-reduced-motion: reduce){
    .ticket, .stamp{animation:none !important; transition:none !important;}
    .ticket.show{opacity:1; transform:none;}
    .stamp.show{opacity:.85; transform:rotate(-18deg) scale(1);}
  }

  @media (max-width:380px){
    .ticket-body{flex-direction:column;}
    .stamp{position:static; margin-top:10px; transform:rotate(-8deg) scale(0);}
    .stamp.show{animation:stampDownMobile .45s .35s cubic-bezier(.34,1.56,.64,1) forwards;}
    @keyframes stampDownMobile{
      0%{transform:rotate(-8deg) scale(2); opacity:0;}
      60%{opacity:.85;}
      100%{transform:rotate(-8deg) scale(1); opacity:.85;}
    }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="letterhead">
    <p class="eyebrow">STUDENT CODE LOOKUP</p>
    <h1>بوابة استخراج كود الطالب</h1>
    <h1>مستر محمد الصباغ</h2>
    <p>اكتب رقم الكود الخاص بك في الخانة أدناه لعرض بطاقتك وكود QR الخاص بك</p>
  </div>

  <div class="search-panel">
    <label class="field-label" for="idInput">رقم الكود</label>
    <div class="search-row">
      <input id="idInput" type="text" inputmode="numeric" placeholder="مثال: 3634487" autocomplete="off" maxlength="7">

    <p class="hint">٧ أرقام بالضبط، كما هو مكتوب في كشف الأسماء</p>

  <div class="result-wrap">
    <div class="empty-msg" id="emptyMsg">لا يوجد كود مطابق. تأكد من الأرقام وحاول مرة أخرى.</div>

    <div class="ticket" id="ticket">
      <div class="ticket-top">

      <div class="ticket-body">
        <div class="qr-frame"><div id="qrcode"></div></div>
        <div class="stamp" id="stamp"><span>صالح<br>Valid</span></div>
      </div>
      <div class="ticket-footer">
        <span id="footerCode"></span>
        <span>ADMIT ONE</span>
      </div>
    </div>
  </div>
</div>

  const idInput   = document.getElementById('idInput');

  const stamp     = document.getElementById('stamp');
  const ticketName= document.getElementById('ticketName');
  const ticketCode= document.getElementById('ticketCode');
  const footerCode= document.getElementById('footerCode');

  let qr = null;

  function runSearch(){
    const code = idInput.value.trim();
    ticket.classList.remove('show');
    stamp.classList.remove('show');
    emptyMsg.classList.remove('show');

    if(!code) return;

    if(Object.prototype.hasOwnProperty.call(STUDENTS, code)){
      const name = STUDENTS[code];

      ticketCode.textContent = '#' + code;
      footerCode.textContent = code;

      if(name){
        ticketName.textContent = name;
        ticketName.classList.remove('no-name');
      }else{
        ticketName.textContent = 'بدون اسم مسجل';
        ticketName.classList.add('no-name');
      }

      document.getElementById('qrcode').innerHTML = '';
      qr = new QRCode(document.getElementById('qrcode'), {
        text: code,
        width: 148,
        height: 148,
        colorDark: '#20180f',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M
      });

      // reflow to restart animation
      void ticket.offsetWidth;
      ticket.classList.add('show');
      requestAnimationFrame(() => stamp.classList.add('show'));
    } else {
      emptyMsg.classList.add('show');
    }
  }
